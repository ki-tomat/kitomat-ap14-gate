name: validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Node-Abhängigkeiten installieren
        run: npm ci

      - name: JavaScript-Tests ausführen
        run: npm test

      - name: Validator-Fallback testen
        run: python3 -m unittest discover -s tools/validators -p 'test_*.py' -v

      - name: Metadaten validieren
        run: python3 tools/validators/validate_metadata.py

      - name: Vollständigkeit validieren
        run: python3 tools/validators/validate_completeness.py

      - name: PII-Heuristik ausführen
        run: python3 tools/validators/pii_heuristic.py
